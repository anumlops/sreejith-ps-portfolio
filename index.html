<!DOCTYPE html>
<html lang="en">

  <a href="#main" class="skip-link">Skip to main content</a>

  <main id="main">

  <section id="hero">
    <!-- REPLACE: hero landscape photo — replace background in style.css .hero-bg -->
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="40" height="40">
          <path d="M20 2 L38 20 L20 38 L2 20 Z" fill="none" stroke="#8AB4C9" stroke-width="2"/>
          <path d="M20 8 L32 20 L20 32 L8 20 Z" fill="#8AB4C9" opacity="0.3"/>
          <line x1="20" y1="8" x2="20" y2="32" stroke="#8AB4C9" stroke-width="1.5"/>
          <line x1="8" y1="20" x2="32" y2="20" stroke="#8AB4C9" stroke-width="1.5"/>
        </svg>
      </div>
      <h1>Sreejith P.S.</h1>
      <p class="tagline">Organic Farmer &amp; Founder, APEC</p>
    </div>
    <!-- REPLACE: portrait photo — replace background in style.css .hero-portrait -->
    <div class="hero-portrait" role="img" aria-label="Portrait of Sreejith P.S."></div>
  </section>

  <!-- ===== BIO ===== -->
  <section id="bio">
    <div class="section-content">
      <h2>About</h2>
      <div class="divider"><span class="divider-dot"></span></div>

    </div>

  <!-- ===== GALLERY ===== -->

      <h2>Gallery</h2>
      <div class="divider"><span class="divider-dot"></span></div>
      <div id="gallery-content" class="gallery-grid"></div>
    </div>
  </section>

  <!-- ===== VIDEOS ===== -->
  <section id="videos">
    <div class="section-content">
      <h2>Videos</h2>
      <div class="divider"><span class="divider-dot"></span></div>
      <div id="videos-content" class="videos-grid"></div>

  <!-- ===== CONTACT ===== -->
  <section id="contact">

      <h2>Contact</h2>
